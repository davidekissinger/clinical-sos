name: Phase 2 validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint new Supabase auth files
        run: npx eslint src/api/supabaseClient.js src/lib/supabaseConfig.js src/lib/supabaseAuth.js
      - name: Production build
        run: npm run build
