name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Typecheck (advisory existing debt)
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        run: npm run lint

      - name: Backend and authorization regression tests
        id: tests
        run: node --test tests/*.test.mjs

      - name: Production build
        id: build
        run: npm run build

      - name: Summarize production validation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Production validation"
            echo ""
            echo "| Check | Result | Policy |"
            echo "| --- | --- | --- |"
            echo "| Install | $INSTALL_OUTCOME | Blocking |"
            echo "| Typecheck | $TYPECHECK_OUTCOME | Advisory existing JavaScript typing debt |"
            echo "| Lint | $LINT_OUTCOME | Blocking |"
            echo "| Tests | $TEST_OUTCOME | Blocking |"
            echo "| Production build | $BUILD_OUTCOME | Blocking |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TYPECHECK_OUTCOME" = "failure" ]; then
            echo "::warning::Typecheck has existing JavaScript inference debt; review diagnostics and do not introduce new errors."
          fi
