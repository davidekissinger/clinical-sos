name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Typecheck (baseline advisory)
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      - name: Summarize baseline validation
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          {
            echo "## Migration baseline validation"
            echo ""
            echo "| Check | Result | Policy |"
            echo "| --- | --- | --- |"
            echo "| Install | $INSTALL_OUTCOME | Blocking |"
            echo "| Typecheck | $TYPECHECK_OUTCOME | Advisory baseline debt |"
            echo "| Lint | $LINT_OUTCOME | Blocking |"
            echo "| Production build | $BUILD_OUTCOME | Blocking |"
            echo ""
            echo "A successful workflow does not mean advisory checks passed. See their logs and docs/migration/base44-migration-inventory.md for the baseline."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TYPECHECK_OUTCOME" = "failure" ]; then
            echo "::warning::Baseline typecheck failed. Review the validation summary and logs; typecheck remains advisory in Phase 1."
          fi
